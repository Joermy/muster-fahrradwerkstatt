# Radhaus Fuhse – Beispiel für nginx mit PHP-FPM (eigener Server)
# Dieselben Sicherheitsköpfe stehen in konfig/kopfzeilen.php und public/.htaccess.
# Prüfen, dass alle drei übereinstimmen: php bin/pruefen.php

server {
    # nginx ab 1.25.1: "listen 443 ssl;" und darunter "http2 on;"
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name radhaus-fuhse.example;

    ssl_certificate     /etc/letsencrypt/live/radhaus-fuhse.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/radhaus-fuhse.example/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Nur public/ ist erreichbar. app/, var/ und .env liegen eine Ebene höher.
    root /srv/radhaus/public;
    index index.html;
    charset utf-8;
    server_tokens off;
    client_max_body_size 64k;

    # Protokolle nach sieben Tagen löschen (logrotate), siehe Datenschutzerklärung
    access_log /var/log/nginx/radhaus.access.log;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-src https://www.openstreetmap.org; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # Versteckte Dateien nie ausliefern, außer .well-known
    location ~ /\.(?!well-known/) {
        deny all;
    }

    # PHP-Dateien sind nicht direkt aufrufbar
    location ~ \.php$ {
        return 404;
    }

    # Schnittstelle: alles unter /api/ an index.php. Die Sicherheitsköpfe setzt dort PHP selbst;
    # ein eigenes add_header hier verhindert, dass die Köpfe der Seiten doppelt dazukommen.
    location ^~ /api/ {
        add_header X-Robots-Tag "noindex" always;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTPS on;
        fastcgi_pass unix:/run/php/php8.3-fpm-radhaus.sock;
    }

    location ^~ /verwaltung/ {
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-src https://www.openstreetmap.org; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        try_files $uri $uri/ =404;
    }

    # 3D-Modell: Typ fehlt in vielen mime.types
    location ~* \.glb$ {
        types { }
        default_type model/gltf-binary;
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        try_files $uri =404;
    }

    location ~* \.(css|js|json|woff2|webp|jpg|png|svg)$ {
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
}

server {
    listen 80;
    listen [::]:80;
    server_name radhaus-fuhse.example;
    return 301 https://$host$request_uri;
}
